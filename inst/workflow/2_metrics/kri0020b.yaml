meta:
  Active: true
  Type: Analysis
  ID: kri0020b
  GroupLevel: Site
  Abbreviation: VS Repeat (Heart Rate)
  Metric: Heart Rate Consecutive Repeat Rate
  Numerator: Windows of Consecutive Identical Heart Rate Values
  Denominator: Evaluable Heart Rate Windows
  Model: Identity
  Score: Heart Rate Consecutive Repeat Rate
  AnalysisType: identity
  ValueCol: pulse
  WindowLength: 3
  # Indirected because workr resolves bare "Numerator" to the meta label.
  NumeratorCol: Numerator
  DenominatorCol: Denominator
  Threshold: "0.2,0.3"
  Flag: "0,1,2"
  AccrualMetric: Denominator
  AccrualThreshold: 3
  GenerateRiskSignal: true
spec:
  Mapped_SUBJ:
    subjid:
      type: character
    invid:
      type: character
  Mapped_VS:
    subjid:
      type: character
    vs_dt:
      type: Date
    pulse:
      type: numeric
steps:
  - output: vThreshold
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Threshold
  - output: vFlag
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Flag
      bSort: false
  # Mapped_VS is pre-sorted by vs_dt then visit, which breaks same-date ties.
  - output: Temp_Repeats
    name: gsm.kri::Detect_ConsecutiveRepeats
    params:
      df: Mapped_VS
      strValueCol: ValueCol
      strSubjectCol: subjid
      strDateCol: vs_dt
      nWindowLength: WindowLength
  - output: Analysis_Input
    name: gsm.core::Input_Rate
    params:
      dfSubjects: Mapped_SUBJ
      dfNumerator: Temp_Repeats
      dfDenominator: Temp_Repeats
      strSubjectCol: subjid
      strGroupCol: invid
      strGroupLevel: GroupLevel
      strNumeratorMethod: Sum
      strDenominatorMethod: Sum
      strNumeratorCol: NumeratorCol
      strDenominatorCol: DenominatorCol
  - output: Analysis_Transformed
    name: gsm.core::Transform_Rate
    params:
      dfInput: Analysis_Input
  - output: Analysis_Analyzed
    name: gsm.core::Analyze_Identity
    params:
      dfTransformed: Analysis_Transformed
  - output: Analysis_Flagged
    name: gsm.core::Flag
    params:
      dfAnalyzed: Analysis_Analyzed
      vThreshold: vThreshold
      vFlag: vFlag
      nAccrualThreshold: AccrualThreshold
      strAccrualMetric: AccrualMetric
  - output: Analysis_Summary
    name: gsm.core::Summarize
    params:
      dfFlagged: Analysis_Flagged
  - output: lAnalysis
    name: list
    params:
      ID: ID
      Analysis_Input: Analysis_Input
      Analysis_Transformed: Analysis_Transformed
      Analysis_Analyzed: Analysis_Analyzed
      Analysis_Flagged: Analysis_Flagged
      Analysis_Summary: Analysis_Summary
