meta:
  Active: true
  Type: Analysis
  ID: srs0002
  GroupLevel: Site
  Abbreviation: Review Priority
  Metric: Site Review Priority Score
  Numerator: KRI weights requiring review
  Denominator: Maximum Weights
  Model: Identity
  Score: Normalized Site Review Priority Score
  AnalysisType: identity
  Priority: 4
  GenerateRiskSignal: true
  ActionWindowDays: 90
  ActionHistoryComplete: false
  ActionAsOfDate: null
  ActionExtractionDate: null
spec:
  Analysis_Summary:
    _all:
      required: true
  Reporting_ActionLog:
    _all:
      required: true
steps:
  - output: dfResults
    name: workr::RunQuery
    params:
      df: Analysis_Summary
      strQuery: |
        SELECT *
        FROM df
        WHERE GroupLevel = 'Site'
          AND MetricID LIKE 'Analysis_kri%'
  - output: lWorkflows
    name: workr::MakeWorkflowList
    params:
      strPath: ./workflow/2_metrics
      strPackage: null
  - output: dfMetrics
    name: gsm.reporting::MakeMetric
    params:
      lWorkflows: lWorkflows
  - output: dfWeights
    name: gsm.kri::MakeWeights
    params:
      dfMetrics: dfMetrics
  - output: dfRiskScoreDetail
    name: gsm.kri::MakeActionRiskScoreDetail
    params:
      dfResults: dfResults
      dfWeights: dfWeights
      dfActionLog: Reporting_ActionLog
      intActionWindowDays: ActionWindowDays
      dActionAsOfDate: ActionAsOfDate
      dActionExtractionDate: ActionExtractionDate
      bActionHistoryComplete: ActionHistoryComplete
  - output: dfRiskScore
    name: gsm.kri::CalculateActionRiskScore
    params:
      dfResults: dfResults
      dfWeights: dfWeights
      dfActionLog: Reporting_ActionLog
      intActionWindowDays: ActionWindowDays
      dActionAsOfDate: ActionAsOfDate
      dActionExtractionDate: ActionExtractionDate
      bActionHistoryComplete: ActionHistoryComplete
  - output: lAnalysis
    name: list
    params:
      ID: ID
      Analysis_Summary: dfRiskScore
      Analysis_ActionRiskScoreDetail: dfRiskScoreDetail
