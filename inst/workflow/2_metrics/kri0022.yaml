meta:
  Active: false
  Type: Analysis
  ID: kri0022
  GroupLevel: Site
  Abbreviation: SB
  Metric: Site Burden
  Numerator: Active Studies Managed by the PI
  Denominator: Site
  Model: Identity
  Score: Numerator
  AnalysisType: identity
  # Placeholder thresholds until the ASCENT-05 analysis (gsm.roadmap#476 SB-Q6).
  Threshold: "5,10"
  Flag: "0,1,2"
  RiskScoreWeight: "0,2,4"
  GenerateRiskSignal: false
spec:
  Mapped_BURDEN:
    invid:
      type: character
    active_protocol_count:
      type: integer
steps:
  - output: vThreshold
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Threshold
  - output: vFlag
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Flag
      bSort: false
  - output: vRiskScoreWeight
    name: gsm.core::ParseThreshold
    params:
      strThreshold: RiskScoreWeight
      bSort: false
  # Counts arrive pre-aggregated per site. The rate steps are bypassed because
  # Transform_Rate() rejects NA, and sites without DQS coverage must stay NA, not 0.
  - output: Analysis_Input
    name: workr::RunQuery
    params:
      df: Mapped_BURDEN
      strQuery: "SELECT invid AS GroupID, 'Site' AS GroupLevel, CAST(active_protocol_count AS DOUBLE) AS Numerator, 1.0 AS Denominator FROM df"
  - output: Analysis_Transformed
    name: workr::RunQuery
    params:
      df: Analysis_Input
      strQuery: "SELECT GroupID, GroupLevel, Numerator, Denominator, Numerator / Denominator AS Metric FROM df"
  - output: Analysis_Analyzed
    name: gsm.core::Analyze_Identity
    params:
      dfTransformed: Analysis_Transformed
      strValueCol: Score
  - output: Analysis_Flagged
    name: gsm.core::Flag
    params:
      dfAnalyzed: Analysis_Analyzed
      vThreshold: vThreshold
      vFlag: vFlag
      vRiskScoreWeight: vRiskScoreWeight
  - output: Analysis_Summary
    name: gsm.core::Summarize
    params:
      dfFlagged: Analysis_Flagged
  - output: lAnalysis
    name: list
    params:
      ID: ID
      Analysis_Input: Analysis_Input
      Analysis_Transformed: Analysis_Transformed
      Analysis_Analyzed: Analysis_Analyzed
      Analysis_Flagged: Analysis_Flagged
      Analysis_Summary: Analysis_Summary
