meta:
  Type: Analysis
  ID: pat0016
  GroupLevel: Subject
  Abbreviation: IPNS
  Metric: IP Non-Starter (Subject)
  Numerator: Confirmed IP Non-Starter
  Denominator: Enrolled Subject
  Model: Identity
  Score: Numerator
  AnalysisType: identity
  # Calibration values are placeholders cloned from the Identity subject sibling
  # (pat0015); pending business sign-off (gsm.kri#258).
  Threshold: "1"
  Flag: "0,2"
  RiskScoreWeight: "0,16"
  AccrualThreshold: 1
  AccrualMetric: Denominator
  # The non-starter window (Potential within/outside) is applied upstream in
  # gsm.mapping::complete_non_starter (WindowDays default 30); recorded here for
  # provenance.
  WindowDays: 30
  GenerateRiskSignal: true
spec:
  Mapped_NonStarter:
    subjid:
      type: character
    confirmed_nonstarter:
      type: integer
  Mapped_SUBJ:
    subjid:
      type: character
steps:
  - output: vThreshold
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Threshold
  - output: vRiskScoreWeight
    name: gsm.core::ParseThreshold
    params:
      strThreshold: RiskScoreWeight
      bSort: false
  - output: vFlag
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Flag
      bSort: false
  - output: Temp_ConfirmedNonStarter
    name: RunQuery
    params:
      df: Mapped_NonStarter
      strQuery: "SELECT * FROM df WHERE confirmed_nonstarter = 1"
  - output: Analysis_Input
    name: gsm.core::Input_Rate
    params:
      dfSubjects: Mapped_SUBJ
      dfNumerator: Temp_ConfirmedNonStarter
      dfDenominator: Mapped_SUBJ
      strSubjectCol: subjid
      strGroupCol: subjid
      strGroupLevel: GroupLevel
      strNumeratorMethod: Count
      strDenominatorMethod: Count
  - output: Analysis_Transformed
    name: gsm.core::Transform_Rate
    params:
      dfInput: Analysis_Input
  - output: Analysis_Analyzed
    name: Analyze_Identity
    params:
      dfTransformed: Analysis_Transformed
      strValueCol: Score
  - output: Analysis_Flagged
    name: gsm.core::Flag
    params:
      dfAnalyzed: Analysis_Analyzed
      vThreshold: vThreshold
      vFlag: vFlag
      vRiskScoreWeight: vRiskScoreWeight
      nAccrualThreshold: AccrualThreshold
      strAccrualMetric: AccrualMetric
  - output: Analysis_Summary
    name: gsm.core::Summarize
    params:
      dfFlagged: Analysis_Flagged
  - output: lAnalysis
    name: list
    params:
      ID: ID
      Analysis_Input: Analysis_Input
      Analysis_Transformed: Analysis_Transformed
      Analysis_Analyzed: Analysis_Analyzed
      Analysis_Flagged: Analysis_Flagged
      Analysis_Summary: Analysis_Summary
