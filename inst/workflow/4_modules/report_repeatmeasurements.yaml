meta:
  Type: Report
  ID: report_repeatmeasurements
  Output: html
  Name: "Repeat Measurements"
  Description: Identical consecutive vital sign measurements (kri0020a-f) - study overview, site/country distribution, participant listing, measure listing and data table (default flag settings)
  Active: true
spec:
  Mapped_VS:
    _all:
      required: true
  Mapped_SUBJ:
    _all:
      required: true
  Reporting_Results:
    _all:
      required: true
  Reporting_Metrics:
    _all:
      required: true
steps:
  - output: lListings
    name: list
    params:
      Mapped_VS: Mapped_VS
      Mapped_SUBJ: Mapped_SUBJ
  - output: strOutputDir
    name: getwd
  - output: lReport
    name: gsm.kri::Report_RepeatMeasurements
    params:
      dfResults: Reporting_Results
      dfMetrics: Reporting_Metrics
      lListings: lListings
      strOutputDir: strOutputDir
