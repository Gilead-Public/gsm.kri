meta:
  Type: Report
  ID: report_timetoae
  Output: html
  Name: Time to First Adverse Event Report
  Description: A report summarizing time to first adverse event by site, with a Kaplan-Meier curve and Poisson observed-vs-expected scatter
  Active: true
  MetricID: Analysis_kri0019
spec:
  Mapped_SUBJ:
    _all:
      required: true
  Mapped_AE:
    _all:
      required: true
  Reporting_Results:
    _all:
      required: true
    Numerator:
      type: numeric
    Denominator:
      type: numeric
    Metric:
      type: numeric
    Score:
      type: numeric
    Flag:
      type: numeric
  Reporting_Metrics:
    _all:
      required: true
  Reporting_Groups:
    _all:
      required: true
  Reporting_Bounds:
    _all:
      required: true
steps:
  - output: lListings
    name: list
    params:
      Mapped_SUBJ: Mapped_SUBJ
      Mapped_AE: Mapped_AE
  - output: strOutputDir
    name: getwd
  - output: lReport
    name: gsm.kri::Report_TimeToAE
    params:
      dfResults: Reporting_Results
      dfMetrics: Reporting_Metrics
      dfGroups: Reporting_Groups
      dfBounds: Reporting_Bounds
      lListings: lListings
      strMetricID: MetricID
      strOutputDir: strOutputDir
