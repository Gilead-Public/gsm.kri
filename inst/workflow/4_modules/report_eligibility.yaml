meta:
  Type: Report
  ID: report_eligibility
  Output: html
  Name: CTQ Eligibility Report
  Description: A report summarizing CTQ
  Active: true
spec:
  Mapped_EXCLUSION:
    _all:
      required: true
  Reporting_Results:
    _all:
      required: true
  Reporting_Groups:
    _all:
      required: true
  Reporting_Metrics:
    _all:
      required: true
steps:
  # Subset on eligibility results.
  - output: dfResults
    name: workr::RunQuery
    params:
      df: Reporting_Results
      strQuery: |
        SELECT *
        FROM df
        WHERE MetricID = 'Analysis_qtl0001'
        ORDER BY SnapshotDate

  # Subset on eligibility metric.
  - output: dfMetrics
    name: workr::RunQuery
    params:
      df: Reporting_Metrics
      strQuery: |
        SELECT *
        FROM df
        WHERE MetricID = 'Analysis_qtl0001'

  # Subset on study-level metadata.
  - output: dfGroups
    name: workr::RunQuery
    params:
      df: Reporting_Groups
      strQuery: |
        SELECT *
        FROM df
        WHERE GroupLevel = 'Study'

  # Define data contributing to numerator and denominator of eligibility metric.
  - output: IE_num
    name: workr::RunQuery
    params:
      df: Mapped_EXCLUSION
      strQuery: "SELECT * FROM df WHERE Source != 'Neither'"
  - output: lListings
    name: list
    params:
      'IE_num': IE_num
      'IE_denom': Mapped_EXCLUSION

  # Define report template inputs.
  - output: strInputPath
    name: system.file
    params:
      ...: "report/Report_Eligibility.Rmd"
      package: "gsm.kri"
  - output: lParams
    name: list
    params:
      dfResults: dfResults
      dfMetrics: dfMetrics
      dfGroups: dfGroups
      lListings: lListings

  # Generate report.
  - output: Report
    name: gsm.kri::RenderRmd
    params:
      lParams: lParams
      strOutputFile: ID
      strInputPath: strInputPath

