meta:
  Type: Report
  ID: report_eligibility
  Output: html
  Name: CTQ Eligibility Report
  Description: A report summarizing CTQ
  Active: true
spec:
  # Optional pilot columns (pd_violation, pd_important, pd_nonimportant,
  # edc_query, edc_pd, iecat_concat) are not declared: CheckSpec warns on every
  # declared column that is missing.
  Mapped_EXCLUSION:
    studyid:
      type: character
    subjid:
      type: character
    country:
      type: character
    invid:
      type: character
    Source:
      type: character
    ie_violation:
      type: character
    ietestcd_concat:
      type: character
    # gsm.mapping delivers a string; study copies may keep a timestamp.
    dvdtm: {}
    eligibility_criteria:
      type: character
  Reporting_Results:
    _all:
      required: true
  Reporting_Groups:
    _all:
      required: true
  Reporting_Metrics:
    _all:
      required: true
steps:
  # Subset on eligibility results.
  - output: dfResults
    name: workr::RunQuery
    params:
      df: Reporting_Results
      strQuery: |
        SELECT *
        FROM df
        WHERE MetricID = 'Analysis_qtl0001'
        ORDER BY SnapshotDate

  # Subset on eligibility metric.
  - output: dfMetrics
    name: workr::RunQuery
    params:
      df: Reporting_Metrics
      strQuery: |
        SELECT *
        FROM df
        WHERE MetricID = 'Analysis_qtl0001'

  # Study metadata for the header; Site rows give the listing's Investigator Name.
  - output: dfGroups
    name: workr::RunQuery
    params:
      df: Reporting_Groups
      strQuery: |
        SELECT *
        FROM df
        WHERE GroupLevel IN ('Study', 'Site')

  # Define data contributing to numerator and denominator of eligibility metric.
  - output: IE_num
    name: workr::RunQuery
    params:
      df: Mapped_EXCLUSION
      strQuery: "SELECT * FROM df WHERE Source != 'Neither'"
  - output: lListings
    name: list
    params:
      'IE_num': IE_num
      'IE_denom': Mapped_EXCLUSION

  # Generate report.
  - output: Report
    name: gsm.kri::Report_Eligibility
    params:
      dfResults: dfResults
      dfMetrics: dfMetrics
      dfGroups: dfGroups
      lListings: lListings
      strOutputFile: ID

