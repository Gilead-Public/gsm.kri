meta:
  Type: Report
  ID: report_eligibility
  Output: html
  Name: CTQ Eligibility Report
  Description: A report summarizing CTQ
  Active: true
spec:
  # _all keeps study-specific columns; ApplySpec drops undeclared ones without
  # it. pd_*, edc_* and iecat_concat are optional (see Report_Eligibility()).
  Mapped_EXCLUSION:
    _all:
      required: true
    studyid:
      type: character
    subjid:
      type: character
    country:
      type: character
    invid:
      type: character
    Source:
      type: character
    ie_violation:
      type: character
    ietestcd_concat:
      type: character
    # gsm.mapping delivers a string; study copies may keep a timestamp.
    dvdtm: {}
    eligibility_criteria:
      type: character
    pd_violation:
      type: character
    pd_important:
      type: character
    pd_nonimportant:
      type: character
    edc_query:
      type: character
    edc_pd:
      type: character
    iecat_concat:
      type: character
  Reporting_Results:
    _all:
      required: true
  Reporting_Groups:
    _all:
      required: true
  Reporting_Metrics:
    _all:
      required: true
steps:
  # Subset on eligibility results.
  - output: dfResults
    name: workr::RunQuery
    params:
      df: Reporting_Results
      strQuery: |
        SELECT *
        FROM df
        WHERE MetricID = 'Analysis_qtl0001'
        ORDER BY SnapshotDate

  # Subset on eligibility metric.
  - output: dfMetrics
    name: workr::RunQuery
    params:
      df: Reporting_Metrics
      strQuery: |
        SELECT *
        FROM df
        WHERE MetricID = 'Analysis_qtl0001'

  # Study metadata for the header; Site rows give the listing's Investigator Name.
  - output: dfGroups
    name: workr::RunQuery
    params:
      df: Reporting_Groups
      strQuery: |
        SELECT *
        FROM df
        WHERE GroupLevel IN ('Study', 'Site')

  # Define data contributing to numerator and denominator of eligibility metric.
  - output: IE_num
    name: workr::RunQuery
    params:
      df: Mapped_EXCLUSION
      strQuery: "SELECT * FROM df WHERE Source != 'Neither'"
  - output: lListings
    name: list
    params:
      'IE_num': IE_num
      'IE_denom': Mapped_EXCLUSION

  # Generate report.
  - output: Report
    name: gsm.kri::Report_Eligibility
    params:
      dfResults: dfResults
      dfMetrics: dfMetrics
      dfGroups: dfGroups
      lListings: lListings
      strOutputFile: ID

