meta:
  Type: Report
  ID: report_eligibility
  Output: html
  Name: CTQ Eligibility Report
  Description: A report summarizing CTQ
spec:
  Reporting_Results_Longitudinal:
    _all:
  Reporting_Groups:
    _all:
  Reporting_Metrics:
    _all:
  Mapped_EXCLUSION:
    _all:
steps:
  # Subset on study-level results.
  - output: dfResults
    name: gsm.core::RunQuery
    params:
      df: Reporting_Results_Longitudinal
      strQuery: |
        SELECT *
        FROM df
        WHERE MetricID = 'Analysis_qtl0001'
        ORDER BY MetricID, SnapshotDate

  # Subset on study-level metrics.
  - output: dfMetrics
    name: gsm.core::RunQuery
    params:
      df: Reporting_Metrics
      strQuery: |
        SELECT *
        FROM df
        WHERE MetricID = 'Analysis_qtl0001'
        ORDER BY MetricID
        
  # Subset on study- and site-level group metadata.
  - output: dfGroups
    name: gsm.core::RunQuery
    params:
      df: Reporting_Groups
      strQuery: |
        SELECT *
        FROM df
        WHERE GroupLevel IN ('Study', 'Site')
        ORDER BY GroupLevel, GroupID, Param

  # Subset on ineligible participants.
  - output: Ineligibility
    name: gsm.core::RunQuery
    params:
      df: Mapped_EXCLUSION
      strQuery: |
        SELECT *
        FROM df
        WHERE Source != 'Neither'

  # Define listings.
  - output: lListings
    name: list
    params:
      'IE_num': Ineligibility
      'IE_denom': Mapped_EXCLUSION

  # Define path to R markdown report template.
  - output: strInputPath
    name: system.file
    params:
      ...: report/Report_Eligibility.Rmd
      package: gsm.kri

  # Capture snapshot date.
  - output: SnapshotDate
    name: pull
    params:
      .data: Reporting_Results_Longitudinal
      var: SnapshotDate
  - output: SnapshotDate
    name: max
    params:
      ...: SnapshotDate

  # Define output path.
  - output: strOutputDir
    name: file.path
    params:
      outputs: outputs
      SnapshotDate: SnapshotDate
  - output: strOutputDir
    name: normalizePath
    params:
      path: strOutputDir

  # Generate report.
  - output: strFilePath
    name: gsm.kri::Report_Eligibility
    params:
      dfResults: dfResults
      dfMetrics: dfMetrics
      dfGroups: dfGroups
      lListings: lListings
      strInputPath: strInputPath
      strOutputDir: strOutputDir
      strOutputFile: ID
